name: Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          TAG="v${VERSION}"
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "APK not found: $APK"; exit 1; }
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$APK" \
            --title "v${VERSION}" \
            --notes "查件助手自动构建版本 v${VERSION}（GitHub Actions）"

      - name: Mirror release to Gitee (国内更新通道)
        if: ${{ secrets.GITEE_TOKEN != '' && secrets.GITEE_OWNER != '' && secrets.GITEE_REPO != '' }}
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          TAG="v$(grep -oP 'versionName "\K[^"]+' app/build.gradle)"
          python3 - "$TAG" <<'PY'
import json, os, sys, urllib.parse, urllib.request, urllib.error, uuid

tag = sys.argv[1]
owner = os.environ["GITEE_OWNER"]
repo = os.environ["GITEE_REPO"]
tok = os.environ["GITEE_TOKEN"]
apk = "app/build/outputs/apk/release/app-release.apk"
base = f"https://gitee.com/api/v5/repos/{owner}/{repo}"

def req(method, path, data=None, upload=False):
    url = base + path
    if upload:
        boundary = "----" + uuid.uuid4().hex
        body = b""
        for k, v in data.items():
            body += f"--{boundary}\r\nContent-Disposition: form-data; name=\"{k}\"\r\n\r\n{v}\r\n".encode()
        fn = os.path.basename(apk)
        with open(apk, "rb") as f:
            body += (f"--{boundary}\r\nContent-Disposition: form-data; name=\"file\"; "
                     f"filename=\"{fn}\"\r\nContent-Type: application/vnd.android.package-archive\r\n\r\n").encode()
            body += f.read() + b"\r\n"
        body += f"--{boundary}--\r\n".encode()
        headers = {"Content-Type": f"multipart/form-data; boundary={boundary}"}
        payload = body
    else:
        if data is not None:
            payload = urllib.parse.urlencode(data).encode()
            headers = {"Content-Type": "application/x-www-form-urlencoded"}
        else:
            payload = None
            headers = {}
    r = urllib.request.Request(url, data=payload, method=method, headers=headers)
    try:
        with urllib.request.urlopen(r, timeout=60) as resp:
            return resp.status, resp.read().decode("utf-8", "replace")
    except urllib.error.HTTPError as e:
        return e.code, e.read().decode("utf-8", "replace")

# 1) 删除同 tag 旧 Release（存在时）
st, body = req("GET", "/releases", {"access_token": tok, "per_page": 100})
if st == 200:
    for rel in json.loads(body):
        if rel.get("tag_name") == tag:
            req("DELETE", f"/releases/{rel['id']}?access_token={tok}")

# 2) 创建 Release（自动打 tag）
st, body = req("POST", "/releases", {
    "access_token": tok,
    "tag_name": tag,
    "name": tag,
    "body": f"查件助手自动构建版本 {tag}（GitHub Actions 镜像到 Gitee）",
    "target_branch": "master",
    "prerelease": "false",
})
print("create release:", st, body[:200])
rel_id = json.loads(body).get("id") if st == 201 else None
if not rel_id:
    sys.exit(f"Gitee release create failed: {st} {body}")

# 3) 上传 APK 附件
st, body = req("POST", f"/releases/{rel_id}/attach_files", {"access_token": tok}, upload=True)
print("attach:", st, body[:200])
if st not in (200, 201) or "browser_download_url" not in body:
    sys.exit(f"Gitee attach failed: {st} {body}")
print("Gitee mirror OK:", tag)
PY
