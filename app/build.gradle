plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chajianzhushou.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.chajianzhushou.app"
        minSdk 24
        targetSdk 34
        versionCode 64
        versionName "3.43"
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            // CI（GitHub Actions）通过 Secrets 注入；本地构建使用默认值
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'Chajian2026!'
            keyAlias System.getenv('KEY_ALIAS') ?: 'chajian'
            keyPassword System.getenv('KEY_PASSWORD') ?: 'Chajian2026!'
        }
    }

    buildTypes {
        release {
            // 安全加固：R8 代码混淆 + 资源压缩，缩小体积并提高逆向门槛
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 强制所有 Kotlin 模块同版本（避免 kotlin-stdlib 1.8.22 与 kotlin-stdlib-jdk7/8 1.6.21 冲突）
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.10'
        force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.9.10'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.json:json:20231013'
}
